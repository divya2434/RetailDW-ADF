# ============================================================
# Azure DevOps CI/CD Pipeline - Azure Data Factory
# Project  : RetailDW-CICD
# ADF      : retailadfdivya2026
# TEST RG  : RG-RetailDW
# ============================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# ============================================================
# VARIABLES
# ============================================================

variables:

  azureServiceConnection: 'SC-RetailDW-Azure'

  subscriptionId: '6bffb135-8008-4cde-bacf-0bea6051483f'

  resourceGroupName: 'RG-RetailDW'

  factoryName: 'retailadfdivya2026'

  location: 'Central India'

  artifactName: 'drop'

# ============================================================
# STAGES
# ============================================================

stages:

# ============================================================
# STAGE 1 - CI
# Validate and Export ADF ARM Template
# ============================================================

- stage: CI
  displayName: 'CI - Validate and Publish ADF'

  jobs:

  - job: BuildADF
    displayName: 'Build ADF ARM Template'

    pool:
      vmImage: 'windows-latest'

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout ADF Repository'

    # --------------------------------------------------------
    # Install Node.js
    # --------------------------------------------------------

    - task: UseNode@1
      displayName: 'Install Node.js'

      inputs:
        version: '18.x'

    # --------------------------------------------------------
    # Initialize npm
    # --------------------------------------------------------

    - script: |
        npm init -y
      displayName: 'Initialize npm'

    # --------------------------------------------------------
    # Install ADF Utilities Locally
    # --------------------------------------------------------

    - script: |
        npm install @microsoft/azure-data-factory-utilities
      displayName: 'Install ADF Utilities'

    # --------------------------------------------------------
    # Verify ADF Utilities Installation
    # --------------------------------------------------------

    - script: |
        echo "Checking ADF Utilities installation..."

        npm list @microsoft/azure-data-factory-utilities

        dir node_modules\@microsoft\azure-data-factory-utilities
      displayName: 'Verify ADF Utilities'

    # --------------------------------------------------------
    # Validate and Export ADF ARM Template
    # --------------------------------------------------------

    - script: |
        echo "Validating Azure Data Factory..."

        npx adfutil build export ^
          "$(Build.SourcesDirectory)" ^
          "$(Build.ArtifactStagingDirectory)\ArmTemplate" ^
          "adf_publish"

      displayName: 'Validate and Export ADF ARM Template'

    # --------------------------------------------------------
    # Verify ARM Template
    # --------------------------------------------------------

    - powershell: |

        Write-Host "Checking generated ARM templates..."

        Get-ChildItem `
          -Path "$(Build.ArtifactStagingDirectory)\ArmTemplate" `
          -Recurse

      displayName: 'Verify ARM Template'

    # --------------------------------------------------------
    # Publish ARM Template
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish ADF ARM Artifact'

      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/ArmTemplate'

        artifact: '$(artifactName)'

        publishLocation: 'pipeline'


# ============================================================
# STAGE 2 - CD
# Deploy ADF to TEST
# ============================================================

- stage: DeployADFTEST
  displayName: 'CD - Deploy ADF to TEST'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - job: DeployADF
    displayName: 'Deploy ADF ARM Template to TEST'

    pool:
      vmImage: 'windows-latest'

    steps:

    # --------------------------------------------------------
    # Download CI Artifact
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download ADF ARM Artifact'

      inputs:

        buildType: 'current'

        artifactName: 'drop'

        targetPath: '$(Pipeline.Workspace)/drop'


    # --------------------------------------------------------
    # Verify ARM Files
    # --------------------------------------------------------

    - powershell: |

        Write-Host "Files available for deployment:"

        Get-ChildItem `
          -Path "$(Pipeline.Workspace)/drop" `
          -Recurse

      displayName: 'Verify ARM Template Files'


    # --------------------------------------------------------
    # Deploy ARM Template to TEST
    # --------------------------------------------------------

    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Deploy ADF ARM Template to TEST'

      inputs:

        deploymentScope: 'Resource Group'

        azureResourceManagerConnection: 'SC-RetailDW-Azure'

        subscriptionId: '6bffb135-8008-4cde-bacf-0bea6051483f'

        action: 'Create Or Update Resource Group'

        resourceGroupName: 'RG-RetailDW'

        location: 'Central India'

        templateLocation: 'Linked artifact'

        csmFile: '$(Pipeline.Workspace)/drop/ARMTemplateForFactory.json'

        csmParametersFile: '$(Pipeline.Workspace)/drop/ARMTemplateParametersForFactory.json'

        overrideParameters: >
          -factoryName "$(factoryName)"

        deploymentMode: 'Incremental'