# ============================================================
# Azure DevOps CI/CD Pipeline - Azure Data Factory
# Project  : RetailDW-CICD
# ADF      : retailadfdivya2026
# TEST RG  : RG-RetailDW
# ============================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Azure DevOps Service Connection
  azureServiceConnection: 'SC-RetailDW-Azure'

  # Azure Subscription
  subscriptionId: '6bffb135-8008-4cde-bacf-0bea6051483f'

  # Resource Group
  resourceGroupName: 'RG-RetailDW'

  # ADF Name
  factoryName: 'retailadfdivya2026'

  # Azure Region
  location: 'Central India'

  # Artifact Name
  artifactName: 'drop'


# ============================================================
# STAGE 1 - CI
# Validate and Publish ADF ARM Templates
# ============================================================

stages:

- stage: CI
  displayName: 'CI - Validate and Publish ADF'

  jobs:

  - job: BuildADF
    displayName: 'Build ADF ARM Template'

    pool:
      vmImage: 'windows-latest'

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout ADF Repository'


    # --------------------------------------------------------
    # Install Node.js
    # --------------------------------------------------------

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '18.x'


    # --------------------------------------------------------
    # Install ADF Utilities
    # --------------------------------------------------------

    - script: |
        npm install -g @microsoft/azure-data-factory-utilities
      displayName: 'Install ADF Utilities'


    # --------------------------------------------------------
    # Validate ADF
    # --------------------------------------------------------

    - script: |
        echo "Validating Azure Data Factory..."
        
        npm run build export "$(Build.SourcesDirectory)" "$(Build.ArtifactStagingDirectory)/ArmTemplate" "adf_publish"
      displayName: 'Validate and Export ADF ARM Template'


    # --------------------------------------------------------
    # Publish ARM Template as Pipeline Artifact
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish ADF ARM Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/ArmTemplate'
        artifact: '$(artifactName)'
        publishLocation: 'pipeline'


# ============================================================
# STAGE 2 - CD
# Deploy ADF to TEST
# ============================================================

- stage: DeployADFTEST
  displayName: 'CD - Deploy ADF to TEST'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - job: DeployADF
    displayName: 'Deploy ADF ARM Template to TEST'

    pool:
      vmImage: 'windows-latest'

    steps:

    # --------------------------------------------------------
    # Download CI Artifact
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download ADF ARM Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'drop'
        targetPath: '$(Pipeline.Workspace)/drop'


    # --------------------------------------------------------
    # Display Files - Optional Debug Step
    # --------------------------------------------------------

    - powershell: |
        Write-Host "Files available for deployment:"
        Get-ChildItem -Path "$(Pipeline.Workspace)/drop" -Recurse
      displayName: 'Verify ARM Template Files'


    # --------------------------------------------------------
    # Deploy ARM Template to TEST
    # --------------------------------------------------------

    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Deploy ADF ARM Template to TEST'

      inputs:

        # Azure Resource Manager
        deploymentScope: 'Resource Group'

        # IMPORTANT:
        # This must exactly match Azure DevOps Service Connection
        azureResourceManagerConnection: 'SC-RetailDW-Azure'

        # Azure Subscription
        subscriptionId: '6bffb135-8008-4cde-bacf-0bea6051483f'

        # ARM Deployment Action
        action: 'Create Or Update Resource Group'

        # Resource Group
        resourceGroupName: 'RG-RetailDW'

        # Azure Region
        location: 'Central India'

        # Template comes from downloaded artifact
        templateLocation: 'Linked artifact'

        # ARM Template
        csmFile: '$(Pipeline.Workspace)/drop/ARMTemplateForFactory.json'

        # ARM Parameters
        csmParametersFile: '$(Pipeline.Workspace)/drop/ARMTemplateParametersForFactory.json'

        # Override ADF name
        overrideParameters: >
          -factoryName "$(factoryName)"

        # Deployment Mode
        deploymentMode: 'Incremental'